name: sahara_fuel_app
description: "نظام إدارة وقود صحاري كربلاء"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # المكتبات الأساسية
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  intl: ^0.20.2
  google_fonts: ^6.1.0
  provider: ^6.1.2
  pdf: ^3.10.8
  printing: ^5.12.0
  excel: ^4.0.3
  path_provider: ^2.1.2

  # الاتصال بالسيرفر
  http: ^1.2.0

  # قاعدة البيانات المحلية
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # التشفير
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
