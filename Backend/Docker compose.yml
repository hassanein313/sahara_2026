# ============================================
# Sahara Fuel SaaS - Docker Compose
# PostgreSQL + Redis + Node.js Backend
# ============================================
version: '3.8'

services:
  # ========== Node.js Backend ==========
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sahara-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-sahara_fuel}
      - DB_USER=${DB_USER:-sahara_admin}
      - DB_PASSWORD=${DB_PASSWORD:-your_strong_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change_this_to_64_char_secret_key}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_this_to_another_64_char_key}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sahara-network
    volumes:
      - app-logs:/app/logs

  # ========== PostgreSQL ==========
  postgres:
    image: postgres:16-alpine
    container_name: sahara-postgres
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-sahara_fuel}
      - POSTGRES_USER=${DB_USER:-sahara_admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-your_strong_password}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sahara_admin} -d ${DB_NAME:-sahara_fuel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sahara-network

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: sahara-redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sahara-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-logs:
    driver: local

networks:
  sahara-network:
    driver: bridge